<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모터 초기 세팅</title>
</head>

<body>

    <h1>모터 초기 세팅</h1>

    <p>
        현재 단계에서는 로그인 후 발급받은 JWT를
        이 페이지에 임시로 입력해서 사용합니다.
    </p>

    <label for="token">JWT Access Token</label>
    <br>
    <input
        id="token"
        type="password"
        placeholder="Swagger에서 발급받은 access_token"
        size="60"
    >

    <hr>

    <h2>θ1</h2>
    <button onclick="jog(1, -1.0)">-</button>
    <span id="theta1">0.0</span>°
    <button onclick="jog(1, 1.0)">+</button>

    <h2>θ2</h2>
    <button onclick="jog(2, -1.0)">-</button>
    <span id="theta2">0.0</span>°
    <button onclick="jog(2, 1.0)">+</button>

    <h2>θ3</h2>
    <button onclick="jog(3, -1.0)">-</button>
    <span id="theta3">0.0</span>°
    <button onclick="jog(3, 1.0)">+</button>

    <br><br>

    <button onclick="saveHome()">
        현재 위치 저장
    </button>

    <button onclick="moveHome()">
    HOME으로 이동
    </button>

    <p id="status">상태: 준비</p>



<script>

let theta1 = 0.0;
let theta2 = 0.0;
let theta3 = 0.0;


function getToken() {
    return document.getElementById("token").value.trim();
}


/* 현재 HOME 기준 각도 조회 */
async function refreshMotorPosition() {

    const token = getToken();

    if (!token) {
        return;
    }

    try {

        const response = await fetch("/api/motor/position", {
            method: "GET",

            headers: {
                "Authorization": "Bearer " + token
            }
        });


        if (!response.ok) {

            document.getElementById("status").textContent =
                "상태: 현재 각도 조회 실패 (" + response.status + ")";

            return;
        }


        const result = await response.json();

        theta1 = result.theta1;
        theta2 = result.theta2;
        theta3 = result.theta3;


        document.getElementById("theta1").textContent =
            theta1.toFixed(1);

        document.getElementById("theta2").textContent =
            theta2.toFixed(1);

        document.getElementById("theta3").textContent =
            theta3.toFixed(1);

    } catch (error) {

        document.getElementById("status").textContent =
            "상태: 현재 각도 조회 중 서버 통신 오류";
    }
}


/* JOG */
async function jog(axis, deltaDeg) {

    const token = getToken();

    if (!token) {

        document.getElementById("status").textContent =
            "상태: JWT를 먼저 입력해주세요.";

        return;
    }


    try {

        const response = await fetch("/api/motor/jog", {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify({
                axis: axis,
                delta_deg: deltaDeg
            })
        });


        if (!response.ok) {

            document.getElementById("status").textContent =
                "상태: JOG 요청 실패 (" + response.status + ")";

            return;
        }


        await response.json();

        await new Promise(resolve => setTimeout(resolve, 100));

        await refreshMotorPosition();


        document.getElementById("status").textContent =
            "상태: θ" + axis + " JOG 성공";

    } catch (error) {

        document.getElementById("status").textContent =
            "상태: 서버 통신 오류";
    }
}


/* 현재 위치를 새로운 HOME으로 저장 */
async function saveHome() {

    const token = getToken();

    if (!token) {

        document.getElementById("status").textContent =
            "상태: JWT를 먼저 입력해주세요.";

        return;
    }


    try {

        const response = await fetch("/api/home/save", {
            method: "POST",

            headers: {
                "Authorization": "Bearer " + token
            }
        });


        if (!response.ok) {

            document.getElementById("status").textContent =
                "상태: HOME 저장 실패 (" + response.status + ")";

            return;
        }


        await response.json();

        await new Promise(resolve => setTimeout(resolve, 100));

        await refreshMotorPosition();


        document.getElementById("status").textContent =
            "상태: 현재 위치를 HOME으로 저장했습니다.";

    } catch (error) {

        document.getElementById("status").textContent =
            "상태: 서버 통신 오류";
    }
}


/* 저장된 HOME으로 이동 */
async function moveHome() {

    const token = getToken();

    if (!token) {

        document.getElementById("status").textContent =
            "상태: JWT를 먼저 입력해주세요.";

        return;
    }


    try {

        const response = await fetch("/api/motor/move-home", {
            method: "POST",

            headers: {
                "Authorization": "Bearer " + token
            }
        });


        if (!response.ok) {

            document.getElementById("status").textContent =
                "상태: HOME 이동 실패 (" + response.status + ")";

            return;
        }


        await response.json();

        await new Promise(resolve => setTimeout(resolve, 100));

        await refreshMotorPosition();


        document.getElementById("status").textContent =
            "상태: HOME 위치로 이동했습니다.";

    } catch (error) {

        document.getElementById("status").textContent =
            "상태: 서버 통신 오류";
    }
}

document.getElementById("token").addEventListener(
    "change",
    async function () {

        if (getToken()) {
            await refreshMotorPosition();
        }
    }
);

</script>

</body>
</html>
